<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De La Cruz — CREATEXODUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <div class="pre-center">
      <img src="../CREATEXODUS LOGO FINAL.png" alt="CREATEXODUS" class="pre-logo">
      <div class="pre-bar-track">
        <div class="pre-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Background -->
  <div class="site-bg" aria-hidden="true"></div>
  <div class="site-pattern" aria-hidden="true">
    <img src="../CE WALL LOGOS.png" alt="" class="site-pattern-img">
  </div>

  <!-- Navigation -->
  <nav class="proj-nav">
    <a href="../index.html" class="proj-nav-logo">
      <img src="../CREATEXODUS LOGO FINAL.png" alt="CREATEXODUS">
    </a>
    <button class="nav-toggle" aria-label="Menu" onclick="document.getElementById('proj-menu').classList.toggle('active');this.classList.toggle('active');document.body.style.overflow=this.classList.contains('active')?'hidden':''">
      <span></span><span></span>
    </button>
  </nav>

  <!-- Full-Screen Menu Overlay -->
  <div id="proj-menu" class="proj-overlay-menu">
    <div class="proj-menu-inner">
      <a href="../index.html#work" class="proj-menu-link">Portfolio</a>
      <a href="../index.html#services" class="proj-menu-link">Services</a>
      <a href="../index.html#about" class="proj-menu-link">About</a>
      <a href="../index.html#contact" class="proj-menu-link">Contact</a>
    </div>
  </div>

  <!-- Hero -->
  <section class="proj-hero">
    <div class="container">
      <div class="proj-hero-label"><span>Project</span><span>—</span><span>De La Cruz</span></div>
      <h1 class="proj-hero-title">De La Cruz</h1>
      <div class="proj-tags">
        <span class="proj-tag">Graphic Design</span>
        <span class="proj-tag">Logo</span>
        <span class="proj-tag">Apparel</span>
        <span class="proj-tag">Tour Flyers</span>
      </div>
      <div class="proj-details">
        <div class="proj-detail-item">
          <div class="proj-detail-label">Client</div>
          <div class="proj-detail-value">De La Cruz</div>
        </div>
        <div class="proj-detail-item">
          <div class="proj-detail-label">Services</div>
          <div class="proj-detail-value">Graphic Design</div>
        </div>
        <div class="proj-detail-item">
          <div class="proj-detail-label">Deliverables</div>
          <div class="proj-detail-value">Logo, Shirt Designs, Mini Tour Flyers</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Media Gallery -->
  <section class="proj-media">
    <div class="container">
      <div class="proj-media-grid">

        <!-- Section: Identity -->
        <div class="proj-media-section-label">Identity</div>

        <div class="proj-media-row">
          <div class="proj-media-half proj-media-contain">
            <img src="../DE LA CRUZ/DE LA CRUZ LOGO.png" alt="De La Cruz — primary logo" loading="lazy">
          </div>
          <div class="proj-media-half proj-media-contain">
            <img src="../DE LA CRUZ/DLC LOGO.png" alt="De La Cruz — DLC monogram" loading="lazy">
          </div>
        </div>

        <!-- Section: Apparel -->
        <div class="proj-media-section-label">Apparel</div>

        <div class="proj-media-row">
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/CRUZ FRONT SHIRT MOCK.png" alt="Cruz shirt — front" loading="lazy">
          </div>
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/CRUZ BACK SHIRT MOCK.png" alt="Cruz shirt — back" loading="lazy">
          </div>
        </div>

        <div class="proj-media-row">
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/MORE THAN DREAM FRONT FINAL.png" alt="More Than A Dream — front" loading="lazy">
          </div>
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/MORE THAN A DREAM FINAL BACK.png" alt="More Than A Dream — back" loading="lazy">
          </div>
        </div>

        <!-- Section: Mini Tour -->
        <div class="proj-media-section-label">Mini Tour — Story Flyers</div>

        <div class="proj-media-full">
          <img src="../DE LA CRUZ/STORY MAIN FLYER.jpg" alt="De La Cruz — main mini tour story flyer" loading="lazy">
        </div>

        <div class="proj-media-row">
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/MINI TOUR CHARLOTTE NC.jpg" alt="Mini tour — Charlotte, NC" loading="lazy">
          </div>
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/MINI TOUR DALLAS TX.jpg" alt="Mini tour — Dallas, TX" loading="lazy">
          </div>
        </div>

        <div class="proj-media-full">
          <img src="../DE LA CRUZ/MINI TOUR ORLANDO FL.jpg" alt="Mini tour — Orlando, FL" loading="lazy">
        </div>

        <div class="proj-media-row">
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/DE LA CRUZ MINI TOUR V1.jpg" alt="Mini tour — key art v1" loading="lazy">
          </div>
          <div class="proj-media-half">
            <img src="../DE LA CRUZ/DE LA CRUZ MINI TOUR V2.jpg" alt="Mini tour — key art v2" loading="lazy">
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="proj-footer">
    <div class="container">
      <div class="proj-footer-inner">
        <img src="../CREATEXODUS LOGO FINAL.png" alt="CREATEXODUS" class="proj-footer-logo">
        <div class="proj-footer-links">
          <a href="../index.html">Home</a>
          <a href="../index.html#work">Work</a>
          <a href="../index.html#services">Services</a>
          <a href="../index.html#contact">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/project.js"></script>
</body>
</html>
